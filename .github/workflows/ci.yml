name: CI

# Mobil kodun derlenebilirliğini ve testlerini her itmede doğrular.
#
# Neden gerekli: depoda sürüm yayınlayan iş (release.yml) vardı ama kodu
# DENETLEYEN hiçbir iş yoktu — bir derleme hatası ancak sürüm etiketi
# atıldığında, yani Play'e çıkarken fark ediliyordu.
#
# Üretilmiş dosyalar (*.g.dart) depoda TUTULUYOR, bu yüzden build_runner
# adımı yok; şema değişikliği yapan biri üretimi yerelde çalıştırmayı
# unutursa `flutter analyze` zaten hata verir.

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobil:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # --enforce-lockfile: pubspec.lock ile pubspec.yaml birbirini
      # TUTMUYORSA kırılır, sessizce güncellemez. Kilit dosyası depoda
      # tutuluyor; bağımlılık eklenip kilit güncellenmediğinde çözüm
      # makineden makineye değişiyor. 0.7.8'de `workmanager` tam olarak
      # böyle eklenmişti ve derleme ancak sürüm anında kırıldı.
      - name: Bağımlılıklar
        run: flutter pub get --enforce-lockfile

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      # DERLEME de denetleniyor, yalnizca analiz ve test degil.
      #
      # `flutter analyze` Dart tarafina bakiyor; Android tarafi (Gradle,
      # manifest merge, eklenti uyumlulugu) ona hic girmiyor. Bir eklenti
      # eklendiginde derleme kirilirsa CI yesil kalir ve sorun ancak surum
      # etiketi atilinca, yani Play'e cikarken ortaya cikar.
      #
      # Imzasiz debug derlemesi yeterli: amac AAB uretmek degil, Android
      # zincirinin ayakta oldugunu dogrulamak. Imza anahtarlari yalnizca
      # release isinde var.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android derlemesi
        run: flutter build apk --debug
