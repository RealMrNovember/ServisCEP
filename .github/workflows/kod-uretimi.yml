name: Kod üretimi (drift)

# Üretilmiş dosyaları (*.g.dart) CI'da yeniden üretip dala geri iter.
#
# NEDEN VAR: `app_database.g.dart` depoda TUTULUYOR (bkz. ci.yml) ve
# `tables.dart` değiştiğinde build_runner ile yeniden üretilmesi gerekiyor.
# Bunun için Flutter SDK'sı lazım; geliştirme makinelerinden birinde kurulu
# değil ve bu yüzden şema değişiklikleri elle yapılamıyordu.
#
# Elle tetiklenir (workflow_dispatch): şema değiştiren dalı seç, çalıştır,
# üretilmiş dosyalar aynı dala commit edilir.
#
# Not: GITHUB_TOKEN ile atılan push yeni workflow tetiklemez (GitHub'ın
# kasıtlı davranışı), dolayısıyla döngü oluşmaz. Üretim sonrası CI'ı
# çalıştırmak için dala normal bir commit itmek ya da CI'ı elle tetiklemek
# gerekir.

on:
  workflow_dispatch:

concurrency:
  group: kod-uretimi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get --enforce-lockfile

      # --delete-conflicting-outputs: şema değişince eski üretilmiş dosya
      # yeni çıktıyla çakışıyor ve build_runner sormadan durmuyor.
      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Şema anlık görüntüsü + göç testi yardımcıları.
      #
      # NEDEN BURADA: göç, uygulamadaki tek GERİ ALINAMAZ iş — yayınlanmış
      # bir sürüm kullanıcının telefonundaki veriyi bozarsa geri dönüş yok
      # (bkz. test/core/database/migration_test.dart). Testin çalışması
      # için her şema sürümünün anlık görüntüsü gerekiyor ve `schema dump`
      # Flutter istiyor; bu iş zaten Flutter kurduğu için en ucuz yer
      # burası. Elle adım bırakılsaydı er ya da geç atlanırdı — v11
      # için tam olarak bu oldu.
      #
      # `dump` yalnızca EKSİK sürümü yazar, mevcutlara dokunmaz.
      - name: Şema anlık görüntüsü
        run: |
          dart run drift_dev schema dump \
            lib/core/database/app_database.dart drift_schemas/
          dart run drift_dev schema generate \
            drift_schemas/ test/generated_migrations/

      - name: Üretilen dosyalar derleniyor mu
        run: flutter analyze

      - name: Commit
        run: |
          if git diff --quiet -- '*.g.dart' 'mobile/drift_schemas' \
              'mobile/test/generated_migrations'; then
            echo "Üretilmiş dosyalarda değişiklik yok."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add '*.g.dart' mobile/drift_schemas mobile/test/generated_migrations
          git commit -m "chore: uretilmis drift dosyalari ve sema anlik goruntusu yenilendi"
          git push origin HEAD:${{ github.ref_name }}
        working-directory: .
