name: Play mağaza görselleri

# Elle tetiklenir. Sürüm hattına bağlanmadı çünkü mağaza görselleri her
# sürümde değişmiyor — her yayında listeye dokunmak gereksiz inceleme
# kuyruğu riski.
#
# Play'de uygulamanın İÇİNDEKİ launcher ikonu ile mağaza listesinin
# simgesi iki ayrı varlık ve birlikte değişmiyorlar. Yeni marka işareti
# 0.7.7 ile uygulamaya girdi, mağaza listesi eskisiyle kaldı; kullanıcı
# Play'de eski, telefonunda yeni logoyu görüyordu.
on:
  workflow_dispatch:
    inputs:
      komut:
        description: 'liste (oku) · yukle (görseller) · metin (açıklamalar) · kanal (oku) · kanal-esitle (alpha→internal)'
        required: true
        default: 'liste'
        type: choice
        options: [liste, yukle, metin, kanal, kanal-esitle]
      hedefler:
        description: 'yukle için: tip=yol (boşlukla ayrılmış)'
        required: false
        default: >-
          icon=assets/branding/play-store-icon.png
          featureGraphic=assets/branding/play-feature-graphic.png
          phoneScreenshots=assets/branding/store

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: pip install --quiet google-auth requests

      # Play'in boyut kuralları katı ve hata mesajları boyuta işaret
      # etmiyor. Burada kırılması, API'den dönen "invalid image" yanıtını
      # çözmeye çalışmaktan çok daha hızlı.
      - name: Görselleri doğrula
        if: inputs.komut == 'yukle'
        run: python3 .github/scripts/verify_store_images.py ${{ inputs.hedefler }}

      - name: Çalıştır
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          case "${{ inputs.komut }}" in
            liste)
              python3 .github/scripts/store_images.py liste
              python3 .github/scripts/store_listing_text.py liste
              ;;
            metin)
              python3 .github/scripts/store_listing_text.py yukle
              ;;
            kanal)
              python3 .github/scripts/play_track_info.py
              ;;
            kanal-esitle)
              python3 .github/scripts/play_sync_tracks.py
              python3 .github/scripts/play_track_info.py
              ;;
            *)
              python3 .github/scripts/store_images.py yukle ${{ inputs.hedefler }}
              ;;
          esac
