# ServisCEP — otomatik sürüm hattı.
#
# Tetikleme: `v*` biçiminde bir tag push'lanınca (ör. v0.2.9). Akış:
#   1. pubspec.yaml'daki sürümle (version: X.Y.Z+N) imzalı "play" flavor
#      AAB'si üretilir, Google Play'e yüklenir.
#
# NOT (2026-08-22): GitHub Releases/APK (OTA) kanalı kasıtlı olarak
# kapatıldı — kullanıcı kararı: "Play birincil ve tek dağıtım kanalı
# olsun." "github" flavor'ı (Gradle'da hâlâ tanımlı, docs/06 § OTA) artık
# CI'da build EDİLMİYOR. Güncellemeler yalnızca Google Play üzerinden
# (Play In-App Update API, "play" flavor zaten bunu kullanıyor) dağıtılır.
#
# Gerekli repository secret'ları (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON  — Play Console'a bağlı service account anahtarı
#   ANDROID_KEYSTORE_BASE64    — upload keystore'un base64 hali
#   ANDROID_KEYSTORE_PASSWORD  — keystore parolası
#   ANDROID_KEY_ALIAS          — anahtar takma adı
#   ANDROID_KEY_PASSWORD       — anahtar parolası
#
# Yeni sürüm çıkarma adımları (yerel makinede):
#   1. mobile/pubspec.yaml → version alanını yükselt (ör. 0.2.9+11 —
#      +N kısmı versionCode'dur, HER sürümde artmalı, Play aynı
#      versionCode'u ikinci kez kabul etmez)
#   2. CHANGELOG.md'ye "## vX.Y.Z" bölümü ekle — kullanıcıya görünecek
#      notlar. ZORUNLUDUR: bölüm yoksa CI sürümü yayınlamaz.
#      Yerelde denemek için:
#        python3 .github/scripts/prepare_release_notes.py vX.Y.Z
#   3. Commit + push
#   4. git tag vX.Y.Z && git push origin vX.Y.Z
#
# NOT: Play her sürümü İNCELEMEDEN geçirir; tag'den sonra kullanıcıya
# ulaşması dakikalar değil, birkaç saat sürebilir.

name: Sürüm Yayınla

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Secret'ların eksiksiz olduğunu doğrula
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Keystore secret'ı boşsa Gradle sessizce debug imzaya düşer
          # (bkz. android/app/build.gradle.kts) — debug imzalı bir yapı hem
          # Play tarafından reddedilir hem OTA'yı kırar. Erken ve açık
          # şekilde başarısız ol.
          if [ -z "$KEYSTORE_B64" ]; then echo "HATA: ANDROID_KEYSTORE_BASE64 secret'ı tanımlı değil"; exit 1; fi
          if [ -z "$PLAY_SA" ]; then echo "HATA: PLAY_SERVICE_ACCOUNT_JSON secret'ı tanımlı değil"; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: İmzalama dosyalarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Kullanıcıya görünen sürüm notu ZORUNLUDUR: tek kaynak CHANGELOG.md.
      # Bölüm yoksa/boşsa, bozuksa veya 500 karakteri aşıyorsa betik hata
      # verir ve sürüm burada durur — notsuz sürüm Play'e çıkamaz
      # (kullanıcı kararı, 2026-08-24).
      # ÖN KONTROL, her şeyden önce.
      #
      # 0.7.8'i yayınlamaya çalışırken üç ayrı sebeple takıldık ve üçü de
      # ancak yayın anında görüldü: etiketle pubspec sürümü uyuşmuyordu,
      # versionCode artmamıştı (Play aynısını ikinci kez kabul etmiyor) ve
      # pubspec.lock güncellenmemişti. Buradaki kontroller o üçünün birebir
      # karşılığı; AAB derlenmeden önce kırılır.
      - name: Sürüm ön kontrolü
        # `working-directory: .` ZORUNLU: işin varsayılanı `mobile` ve
        # betik depo kökünde. Bir alt adımda (sürüm notu) aynı geçersiz
        # kılma zaten vardı; burada eksikti ve ilk denemede sürüm tam bu
        # yüzden düştü.
        working-directory: .
        run: python3 .github/scripts/release_preflight.py "${GITHUB_REF_NAME}"

      - name: Sürüm notunu CHANGELOG'dan hazırla
        working-directory: .
        run: python3 .github/scripts/prepare_release_notes.py "${GITHUB_REF_NAME}"


      - name: Bağımlılıklar
        run: flutter pub get

      - name: Play AAB derle
        run: flutter build appbundle --release --flavor play

      - name: Google Play'e yükle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cicibyte.serviscep
          releaseFiles: mobile/build/app/outputs/bundle/playRelease/app-play-release.aab
          # "Yenilikler" metni — CHANGELOG.md'den üretilir (yukarıdaki adım).
          whatsNewDirectory: mobile/whatsnew
          # NOT (2026-08-23): v0.2.11 kapalı test (alpha) sürümü Play
          # Developer API ile doğrulandı — "draft app" kısıtlaması geçti,
          # alpha track "completed" durumda gerçek bir sürüm barındırıyor.
          # Otomatik yüklemeler artık doğrudan kapalı teste (alpha) akıyor.
          # `track` KULLANIMDAN KALDIRILDI (action README). `tracks`
          # virgülle ayrılmış isim listesi bekliyor (kaynakta `split(',')`).
          # Eski alan bir gün kaldırılırsa sürüm yayınlamak tamamen
          # kırılırdı.
          #
          # İKİ KANAL BİRDEN (2026-08-29): Play, bir kullanıcıyı uygun
          # olduğu EN ÖNCELİKLİ kanaldan besliyor ve iç test kapalı testin
          # önünde. Yalnızca alpha'ya yayınlarken iç test listesindeki
          # hesaplar aylar öncesinin 0.2.12'sinde kalmıştı: uygulamayı
          # "kullanıyoruz" diyorlardı ama ellerindeki neredeyse başka bir
          # uygulamaydı. Aynı AAB tek yüklemede iki kanala atanıyor —
          # kanallar bir daha ayrışmıyor.
          tracks: internal,alpha
          status: completed

      # Sunucudaki sürüm kaydını CI yazar.
      #
      # Bu adım, elle yapılan bir işi ortadan kaldırmak için var. Sürüm
      # panelden elle giriliyordu ve bir kez unutuldu: 0.7.5 Play'e çıktı,
      # sunucu hâlâ "sürüm yok" dediği için hiçbir kullanıcıya güncelleme
      # bildirimi gitmedi. Elle kalan her adım er ya da geç unutulur.
      #
      # Yükleme adımından SONRA çalışır — Play'e çıkmamış bir sürümü
      # kullanıcıya duyurmak, indirilemeyen bir güncelleme göstermek olurdu.
      #
      # Bu adım kırmızı verirse AAB zaten yüklenmiştir; eksik olan yalnızca
      # duyurudur ve panelden elle tamamlanabilir. Yine de sessizce
      # geçilmiyor: sessiz geçmek, düzeltmeye çalıştığımız hatanın ta kendisi.
      - name: Sunucuya yayındaki sürümü bildir
        # `working-directory: .` ZORUNLU — işin varsayılanı `mobile`.
        # v0.7.8'de bu adım tam olarak bunu atladığı için düştü:
        # `mobile/pubspec.yaml` yolu `mobile/mobile/pubspec.yaml` oluyordu.
        # AAB derlenip Play'e çıkmıştı; yalnızca sürüm kaydı yazılamadı ve
        # elle yazmak gerekti — yani adımın önlemek için var olduğu şey.
        working-directory: .
        env:
          JETON: ${{ secrets.APP_VERSION_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          # pubspec tek kaynak: AAB'yi de bu satır belirledi.
          SATIR=$(grep -m1 '^version:' mobile/pubspec.yaml | awk '{print $2}')
          SURUM="${SATIR%%+*}"
          YAPI="${SATIR##*+}"

          echo "Bildiriliyor: ${SURUM} (${YAPI})"

          # JSON'u python3 üretiyor, jq değil: sürüm notunu zaten python3
          # hazırlıyor (prepare_release_notes.py), yani yeni bir araç
          # bağımlılığı eklemeye gerek yok.
          python3 - "$SURUM" "$YAPI" > /tmp/surum.json <<'PYEOF'
          import json, sys
          notlar = open('mobile/whatsnew/whatsnew-tr-TR', encoding='utf-8').read()
          print(json.dumps({
              'version': sys.argv[1],
              'build': int(sys.argv[2]),
              'notes': notlar,
          }))
          PYEOF

          # --fail-with-body: HTTP hatasında hem çıkışı kırar hem gövdeyi
          # gösterir; yalnızca --fail olsaydı sunucunun sebebi kaybolurdu.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --retry-connrefused -X POST https://serviscep.cicibyte.com/api/v1/app/version -H "Authorization: Bearer ${JETON}" -H 'Content-Type: application/json' -H 'Accept: application/json' --data @/tmp/surum.json
