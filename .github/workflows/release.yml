# ServisCEP — otomatik sürüm hattı.
#
# Tetikleme: `v*` biçiminde bir tag push'lanınca (ör. v0.2.9). Akış:
#   1. pubspec.yaml'daki sürümle (version: X.Y.Z+N) imzalı yapılar üretilir
#   2. "play" flavor AAB → Google Play kapalı test (alpha) track'ine yüklenir
#   3. "github" flavor APK → GitHub Release'e eklenir (uygulama içi OTA
#      güncelleme bu APK'yı çeker — bkz. docs/06 § OTA)
#
# Gerekli repository secret'ları (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON  — Play Console'a bağlı service account anahtarı
#   ANDROID_KEYSTORE_BASE64    — upload keystore'un base64 hali
#   ANDROID_KEYSTORE_PASSWORD  — keystore parolası
#   ANDROID_KEY_ALIAS          — anahtar takma adı
#   ANDROID_KEY_PASSWORD       — anahtar parolası
#
# Yeni sürüm çıkarma adımları (yerel makinede):
#   1. mobile/pubspec.yaml → version alanını yükselt (ör. 0.2.9+11 —
#      +N kısmı versionCode'dur, HER sürümde artmalı, Play aynı
#      versionCode'u ikinci kez kabul etmez)
#   2. Commit + push
#   3. git tag v0.2.9 && git push origin v0.2.9

name: Sürüm Yayınla

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release oluşturmak için
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Secret'ların eksiksiz olduğunu doğrula
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Keystore secret'ı boşsa Gradle sessizce debug imzaya düşer
          # (bkz. android/app/build.gradle.kts) — debug imzalı bir yapı hem
          # Play tarafından reddedilir hem OTA'yı kırar. Erken ve açık
          # şekilde başarısız ol.
          if [ -z "$KEYSTORE_B64" ]; then echo "HATA: ANDROID_KEYSTORE_BASE64 secret'ı tanımlı değil"; exit 1; fi
          if [ -z "$PLAY_SA" ]; then echo "HATA: PLAY_SERVICE_ACCOUNT_JSON secret'ı tanımlı değil"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: İmzalama dosyalarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Play AAB derle
        run: flutter build appbundle --release --flavor play

      - name: GitHub APK derle (OTA kanalı)
        run: flutter build apk --release --flavor github

      - name: Google Play'e yükle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cicibyte.serviscep
          releaseFiles: mobile/build/app/outputs/bundle/playRelease/app-play-release.aab
          # NOT: Uygulama Play Console'da hâlâ taslak (draft) — mağaza kurulum
          # görevleri (listing, içerik derecelendirmesi, veri güvenliği)
          # tamamlanana kadar kapalı test (alpha) track'ine "completed" sürüm
          # yüklenemiyor ("Only releases with status draft may be created on
          # draft app"). Dahili test taslak uygulamada da çalıştığı için
          # şimdilik internal'a yüklüyoruz; kurulum bitip uygulama yayına
          # geçince burası alpha'ya çevrilecek (14 gün / 12 testçi sayacı
          # kapalı testte işler).
          track: internal
          status: completed

      - name: GitHub Release oluştur (OTA APK ile)
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-github-release.apk
          generate_release_notes: true
