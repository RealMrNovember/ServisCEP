<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ServisCEP — Çok Yakında</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b1120;
    --fg: #e5e9f2;
    --muted: #8892a6;
    --accent: #4f8cff;
    --card: #121a2b;
    --border: #202b42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #16213d 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    padding: 48px 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    color: #fff;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 8px;
    font-size: 15px;
  }
  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(79,140,255,0.12);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SC</div>
    <h1>ServisCEP çok yakında burada.</h1>
    <p>Saha teknik servis işletmeleri için mobil-first, offline-first işletme yönetim platformu üzerinde çalışıyoruz.</p>
    <p>Bu alan aktif geliştirme aşamasındadır.</p>
    <span class="badge">Geliştirme Aşamasında</span>
  </div>
</body>
</html>
