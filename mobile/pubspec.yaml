name: serviscep
# NOT: "name: serviscep" Dart paket kimliğidir (kullanıcı görmez) — Play'deki
# com.cicibyte.serviscep paket adı gibi teknik kimlik olarak kalır. Marka adı
# TeknikCEP'tir (2026-08-23 rebrand, ServisCep isim benzerliği nedeniyle).
description: "TeknikCEP - saha teknik servis isletmeleri icin mobil-first, offline-first isletme yonetim uygulamasi."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.8.2+35

environment:
  # NOT: 3.12.2 olarak ayarlıydı ama şu an erişilebilen en güncel Flutter
  # Docker image'ı (ghcr.io/cirruslabs/flutter:stable, Flutter 3.44.0) Dart
  # 3.12.0 ile geliyor — ikisi arasında sadece patch farkı var, API/dil
  # değişikliği yok. Gerçek geliştirme makinesinde daha yeni bir Dart varsa
  # sorun olmaz (kısıtlama zaten "veya üstü" anlamına gelir).
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Tasarım sisteminin özel ikon seti SVG olarak geliyor; bkz.
  # assets/icons/tc/ ve tool/split_icons.dart.
  flutter_svg: ^2.0.17
  go_router: ^17.5.0
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: 9.2.4
  connectivity_plus: ^7.3.1
  intl: 0.20.2
  path_provider: ^2.1.6
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  signature: ^6.4.0
  path: ^1.9.1
  google_sign_in: 6.2.2
  package_info_plus: ^9.0.1
  http: ^1.6.0
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^12.0.2
  cross_file: ^0.3.5+4
  table_calendar: ^3.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  open_filex: ^4.7.0
  in_app_update: ^5.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Uygulama KAPALIYKEN outbox'i gonderen arka plan gorevi.
  # Dart'in Timer.periodic'i arka planda askiya alindigi icin sart —
  # bkz. lib/core/sync/background_sync.dart
  #
  # Kisit DAR tutuluyor. Once '>=0.5.2 <1.0.0' yazilmisti; kod 0.10 API'sine
  # gore yaziliyken cozucu pekala 0.6'yi secebiliyordu ve `initialize`
  # imzasi degistigi icin derleme "Too many positional arguments" ile
  # kiriliyordu (CI'da tam olarak bu yasandi).
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/
    # Tasarım sisteminin ikon seti. Tasarımcı tek bir SVG "sprite"
    # teslim ediyor; tool/split_icons.dart onu tek tek dosyalara böler,
    # çünkü flutter_svg sprite içindeki <use> başvurularını çözemez.
    - assets/icons/tc/
    # PDF'e GÖMÜLEN font. Standart PDF fontları (Helvetica) WinAnsi
    # kodlamasıyla sınırlıdır ve ş/ğ/İ karakterlerini İÇERMEZ — Türkçe bir
    # teklif belgesi o fontla bozuk çıkar. Roboto (Apache-2.0) gömülüdür ki
    # belge internet olmadan da doğru üretilsin.
    - assets/fonts/

  # Arayüz fontları — tasarım sistemi § 3.
  #
  # Üçü de OFL lisanslı ve GÖMÜLÜ; çalışma anında indirilmezler. Uygulama
  # offline-first olduğu için bu şart: kullanıcı bodrum katında açtığında
  # da yazı tipi doğru gelmeli.
  #
  # Kaynaklar: Barlow -> google/fonts, Archivo -> Omnibus-Type/Archivo,
  # JetBrains Mono -> JetBrains/JetBrainsMono. Lisans metinleri
  # assets/fonts/OFL-*.txt içinde.
  fonts:
    # Başlıklar.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700

    # Arayüz gövdesi.
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

    # Tutar ve belge numarası (tabular rakam hizası).
    #
    # DİKKAT: JetBrains Mono'da ₺ (U+20BA) glifi YOKTUR. Tutarlar bu fontla
    # yazıldığı için, ₺ işareti yedek aileden alınır; bkz. AppTypography.mono
    # içindeki fontFamilyFallback. Yedek kaldırılırsa her tutarda kutucuk
    # çıkar.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

    # Yedek aile — yalnızca JetBrains Mono'nun kapsamadığı glifler için.
    # Zaten PDF üretimi için gömülü olduğundan ek boyut getirmez.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
